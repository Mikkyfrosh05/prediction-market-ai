name: Prediction Market AI

"on":
  workflow_dispatch:

  workflow_run:
    workflows:
      - Update Market Data
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

jobs:
  scan-markets:

    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Repeated BTC Market Monitoring
        env:
          PREDICT_API_KEY: ${{ secrets.PREDICT_API_KEY }}
        run: |
          set -e

          for i in $(seq 1 10)
          do
            echo "======================================"
            echo "MARKET CHECK $i OF 10"
            echo "======================================"

            echo "Fetching BTC price..."
            python btc_price_tracker.py

            echo "Scanning Predict.fun markets..."
            python main.py

            echo "Running BTC strategy engine..."
            python strategy_engine.py

            if [ "$i" -lt 10 ]; then
              echo "Waiting 25 seconds before next check..."
              sleep 25
            fi
          done

      - name: Save market, BTC and strategy data
        run: |
          git config user.name "Market Data Bot"
          git config user.email "actions@github.com"

          git add orderbooks.json btc_price_data.json strategy_decisions.json

          git diff --cached --quiet || git commit -m "Update BTC market monitoring data"

          git push
