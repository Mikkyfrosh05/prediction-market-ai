name: Prediction Market AI

"on":
  workflow_dispatch:

  workflow_run:
    workflows:
      - Update Market Data
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

jobs:
  scan-markets:

    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout public AI repository
        uses: actions/checkout@v5

      - name: Checkout private trading records
        uses: actions/checkout@v5
        with:
          repository: Mikkyfrosh05/-prediction-market-private-data
          token: ${{ secrets.GH_PRIVATE_DATA_TOKEN }}
          path: private-data
          ref: main

      - name: Restore previous trading records
        run: |
          for file in risk_state.json paper_trades.json
          do
            if [ -f "private-data/$file" ]; then
              cp "private-data/$file" "$file"
              echo "Restored $file"
            else
              echo "$file does not exist yet."
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Repeated BTC Market Monitoring
        env:
          PREDICT_API_KEY: ${{ secrets.PREDICT_API_KEY }}
        run: |
          set -e

          for i in $(seq 1 10)
          do
            echo "======================================"
            echo "MARKET CHECK $i OF 10"
            echo "======================================"

            echo "Fetching BTC price..."
            python btc_price_tracker.py

            echo "Scanning Predict.fun markets..."
            python main.py

            echo "Running BTC strategy engine..."
            python strategy_engine.py

            if [ "$i" -lt 10 ]; then
              echo "Waiting 25 seconds before next check..."
              sleep 25
            fi
          done

      - name: Save records to private repository
        run: |
          for file in risk_state.json paper_trades.json
          do
            if [ -f "$file" ]; then
              cp "$file" private-data/
              echo "Prepared $file for private storage."
            else
              echo "$file does not exist yet."
            fi
          done

          git -C private-data config user.name "Market Data Bot"
          git -C private-data config user.email "actions@github.com"

          git -C private-data add -A

          if ! git -C private-data diff --cached --quiet; then
            git -C private-data commit -m "Update private trading records"
            git -C private-data push origin HEAD:main
          else
            echo "No private trading record changes."
          fi

      - name: Protect private files and save market data
        run: |
          touch .gitignore

          for file in risk_state.json paper_trades.json private-data/
          do
            grep -qxF "$file" .gitignore || echo "$file" >> .gitignore
          done

          git rm --cached --ignore-unmatch risk_state.json paper_trades.json

          git config user.name "Market Data Bot"
          git config user.email "actions@github.com"

          git add .gitignore orderbooks.json btc_price_data.json strategy_decisions.json

          git diff --cached --quiet || git commit -m "Update BTC market monitoring data"

          git push
