name: Prediction Market AI

"on":
  workflow_dispatch:

  workflow_run:
    workflows:
      - Update Market Data
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

jobs:
  scan-markets:

    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      - name: Checkout public AI repository
        uses: actions/checkout@v5

      - name: Checkout private trading records
        uses: actions/checkout@v5
        with:
          repository: Mikkyfrosh05/-prediction-market-private-data
          token: ${{ secrets.GH_PRIVATE_DATA_TOKEN }}
          path: private-data
          ref: main

      - name: Restore previous trading records
        run: |
          for file in risk_state.json paper_trades.json
          do
            if [ -f "private-data/$file" ]; then
              cp "private-data/$file" "$file"
              echo "Restored $file"
            else
              echo "$file does not exist yet."
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Three Minute BTC Market Monitoring
        env:
          PREDICT_API_KEY: ${{ secrets.PREDICT_API_KEY }}
        run: |
          set -e

          START_TIME=$(date +%s)
          MONITOR_DURATION=180
          INTERVAL=5

          CHECK=0

          while true
          do
            NOW=$(date +%s)
            ELAPSED=$((NOW - START_TIME))

            if [ "$ELAPSED" -ge "$MONITOR_DURATION" ]; then
              break
            fi

            CHECK=$((CHECK + 1))

            echo ""
            echo "======================================"
            echo "BTC MONITORING CHECK $CHECK"
            echo "Elapsed monitoring time: ${ELAPSED}s"
            echo "======================================"

            echo ""
            echo "STEP 1: Fetching fresh BTC market discovery data..."

            python - <<'PY'
          import os
          import json
          import requests
          import time

          from datetime import datetime, timezone

          API_URL = "https://api.predict.fun/v1/categories"
          API_KEY = os.environ.get("PREDICT_API_KEY")

          if not API_KEY:
              raise ValueError("PREDICT_API_KEY is missing")

          HEADERS = {
              "x-api-key": API_KEY,
              "accept": "application/json"
          }

          now = int(time.time())
          current_round = (now // 300) * 300

          collected = []
          seen = set()

          print("Current UTC time:",
                datetime.now(timezone.utc).isoformat())

          print("Current BTC round:", current_round)

          # Fetch the previous, current and next two rounds.
          for offset in range(-1, 3):

              timestamp = current_round + (offset * 300)

              slug = f"btc-updown-5m-{timestamp}"

              url = f"{API_URL}/{slug}"

              print("\nChecking category:", slug)

              try:

                  response = requests.get(
                      url,
                      headers=HEADERS,
                      timeout=15
                  )

                  if response.status_code == 404:
                      print("Category not found.")
                      continue

                  response.raise_for_status()

                  result = response.json()

              except requests.RequestException as error:

                  print("Category request failed:", error)
                  continue

              if not result.get("success"):
                  print("Unsuccessful API response.")
                  continue

              category = result.get("data")

              if not category:
                  continue

              variant_data = category.get("variantData") or {}
              details = category.get("variantDetails") or {}
              crypto = details.get("crypto") or {}

              symbol = (
                  crypto.get("priceFeedSymbol")
                  or variant_data.get("priceFeedSymbol")
                  or ""
              )

              variant_type = (
                  variant_data.get("type")
                  or category.get("marketVariant")
              )

              if isinstance(variant_type, dict):
                  variant_type = variant_type.get("type")

              if variant_type != "CRYPTO_UP_DOWN":
                  continue

              if not str(symbol).upper().startswith("BTC"):
                  continue

              start = category.get("startsAt")
              end = category.get("endsAt")

              if not start or not end:
                  continue

              start_dt = datetime.fromisoformat(
                  start.replace("Z", "+00:00")
              )

              end_dt = datetime.fromisoformat(
                  end.replace("Z", "+00:00")
              )

              duration = int(
                  (end_dt - start_dt).total_seconds()
              )

              if duration != 300:
                  continue

              for market in category.get("markets") or []:

                  market_id = market.get("id")

                  if market_id is None:
                      continue

                  market_id = str(market_id)

                  if market_id in seen:
                      continue

                  if market.get("tradingStatus") != "OPEN":
                      continue

                  if market.get("status") == "RESOLVED":
                      continue

                  if market.get("isVisible") is not True:
                      continue

                  record = dict(market)

                  record["category_id"] = category.get("id")
                  record["category_slug"] = category.get("slug")
                  record["category_title"] = category.get("title")
                  record["startsAt"] = start
                  record["endsAt"] = end
                  record["duration_seconds"] = duration
                  record["price_feed_symbol"] = symbol
                  record["crypto_variant"] = variant_type
                  record["crypto_start_price"] = crypto.get("startPrice")
                  record["crypto_end_price"] = crypto.get("endPrice")

                  collected.append(record)
                  seen.add(market_id)

                  print(
                      "BTC MARKET FOUND:",
                      market.get("title"),
                      "| ID:", market_id
                  )

          output = {
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "asset": "BTC",
              "market_type": "CRYPTO_UP_DOWN",
              "timeframe": "5 minutes",
              "duration_seconds": 300,
              "total_markets": len(collected),
              "markets": collected
          }

          with open("market_data.json", "w") as file:
              json.dump(output, file, indent=2)

          print("\nMARKET DISCOVERY COMPLETE")
          print("Markets collected:", len(collected))
          PY

            echo ""
            echo "STEP 2: Fetching fresh BTC price..."

            python btc_price_tracker.py

            echo ""
            echo "STEP 3: Refreshing Predict.fun order books..."

            python main.py

            echo ""
            echo "STEP 4: Evaluating trading opportunities..."

            python strategy_engine.py

            echo ""
            echo "Monitoring check $CHECK completed."

            NOW=$(date +%s)
            ELAPSED=$((NOW - START_TIME))

            if [ "$ELAPSED" -ge "$MONITOR_DURATION" ]; then
              break
            fi

            REMAINING=$((INTERVAL - (ELAPSED % INTERVAL)))

            if [ "$REMAINING" -gt 0 ] && [ "$REMAINING" -lt "$INTERVAL" ]; then
              echo "Waiting ${REMAINING} seconds..."
              sleep "$REMAINING"
            fi

          done

          echo ""
          echo "======================================"
          echo "THREE MINUTE MONITORING COMPLETED"
          echo "Total checks performed: $CHECK"
          echo "======================================"

      - name: Save records to private repository
        run: |
          for file in risk_state.json paper_trades.json
          do
            if [ -f "$file" ]; then
              cp "$file" private-data/
              echo "Prepared $file for private storage."
            else
              echo "$file does not exist yet."
            fi
          done

          git -C private-data config user.name "Market Data Bot"
          git -C private-data config user.email "actions@github.com"

          git -C private-data add -A

          if ! git -C private-data diff --cached --quiet; then
            git -C private-data commit -m "Update private trading records"
            git -C private-data push origin HEAD:main
          else
            echo "No private trading record changes."
          fi

      - name: Protect private files and save monitoring data
        run: |
          touch .gitignore

          git config user.name "Market Data Bot"
          git config user.email "actions@github.com"

          for file in risk_state.json paper_trades.json private-data/
          do
            grep -qxF "$file" .gitignore || echo "$file" >> .gitignore
          done

          git rm --cached --ignore-unmatch risk_state.json paper_trades.json

          git add .gitignore market_data.json orderbooks.json btc_price_data.json strategy_decisions.json

          git diff --cached --quiet || git commit -m "Update BTC monitoring data"

          git push
