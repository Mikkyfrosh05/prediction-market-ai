name: Auto Settle Paper Trades

"on":
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: private-paper-records
  cancel-in-progress: false

jobs:
  settle-trades:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout AI repository
        uses: actions/checkout@v5

      - name: Checkout private trading records
        uses: actions/checkout@v5
        with:
          repository: Mikkyfrosh05/-prediction-market-private-data
          token: ${{ secrets.GH_PRIVATE_DATA_TOKEN }}
          path: private-data
          ref: main

      - name: Restore private trading records
        run: |
          set -e

          for file in risk_state.json paper_trades.json
          do
            if [ ! -f "private-data/$file" ]; then
              echo "Missing required file: $file"
              exit 1
            fi

            cp "private-data/$file" "$file"
            echo "Restored $file"
          done

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Discover and settle resolved markets
        env:
          PREDICT_API_KEY: ${{ secrets.PREDICT_API_KEY }}
        run: |
          set -e

          python - <<'PY'
          import os
          import requests

          from paper_trader import PaperTrader

          api_key = os.environ.get("PREDICT_API_KEY")

          if not api_key:
              raise RuntimeError("Predict.fun API key is missing.")

          headers = {
              "x-api-key": api_key,
              "accept": "application/json"
          }

          bot = PaperTrader()

          open_trades = [
              trade for trade in bot.trades
              if str(trade.get("status", "")).upper() == "OPEN"
          ]

          market_ids = sorted({
              str(trade.get("market_id"))
              for trade in open_trades
              if trade.get("market_id") is not None
          })

          print("====================================")
          print("AUTOMATIC PAPER TRADE SETTLEMENT")
          print("====================================")

          print("Open trades:", len(open_trades))
          print("Distinct open markets:", len(market_ids))

          if not market_ids:
              print("No open paper trades to settle.")
              raise SystemExit(0)

          settled_total = 0
          skipped_total = 0

          for market_id in market_ids:

              print("\n------------------------------------")
              print("Checking market:", market_id)

              url = f"https://api.predict.fun/v1/markets/{market_id}"

              response = requests.get(
                  url,
                  headers=headers,
                  timeout=20
              )

              response.raise_for_status()

              result = response.json()

              if not result.get("success"):
                  raise RuntimeError(
                      f"Unsuccessful API response for {market_id}"
                  )

              market = result.get("data") or {}

              if str(market.get("id")) != market_id:
                  raise RuntimeError(
                      f"Market ID mismatch for {market_id}"
                  )

              print("Title:", market.get("title"))
              print("Market status:", market.get("status"))

              if market.get("status") != "RESOLVED":
                  print("Market is not resolved. Skipping.")
                  skipped_total += 1
                  continue

              resolution = market.get("resolution") or {}

              if resolution.get("status") != "WON":
                  print("Official winning outcome not confirmed.")
                  skipped_total += 1
                  continue

              outcome = str(
                  resolution.get("name", "")
              ).upper()

              if outcome not in ["UP", "DOWN"]:
                  print("Unknown winning outcome. Skipping.")
                  skipped_total += 1
                  continue

              print("Official winning outcome:", outcome)

              matching_trades = [
                  trade for trade in bot.trades
                  if str(trade.get("market_id")) == market_id
                  and str(trade.get("status", "")).upper() == "OPEN"
              ]

              if not matching_trades:
                  print("No open trades remain for this market.")
                  continue

              print(
                  "Open trades to settle:",
                  len(matching_trades)
              )

              settlement = bot.settle_trade(
                  market_id,
                  outcome
              )

              if not isinstance(settlement, dict):
                  raise RuntimeError(
                      f"Unexpected settlement response for {market_id}"
                  )

              if settlement.get("error"):
                  raise RuntimeError(settlement["error"])

              if not settlement.get("success"):
                  raise RuntimeError(
                      f"Settlement failed for market {market_id}"
                  )

              expected = len(matching_trades)
              actual = settlement.get("settled_count", 0)

              if actual != expected:
                  raise RuntimeError(
                      f"Expected {expected} settlements, "
                      f"but received {actual} for market {market_id}"
                  )

              settled_total += actual

              print("Successfully settled:", actual)

              for trade in settlement.get("trades", []):
                  print("----------------------------")
                  print("Trade ID:", trade.get("trade_id"))
                  print("Direction:", trade.get("side"))
                  print("Entry price:", trade.get("entry_price"))
                  print("Stake:", trade.get("stake"))
                  print("Payout:", trade.get("payout"))
                  print("Profit:", trade.get("profit"))
                  print("Status:", trade.get("status"))

          print("\n====================================")
          print("SETTLEMENT CHECK COMPLETED")
          print("Trades settled:", settled_total)
          print("Markets skipped:", skipped_total)
          print("====================================")

          print("\nUPDATED PAPER ACCOUNT")

          for key, value in bot.get_status().items():
              print(f"{key}: {value}")

          print("\nREAL TRADING REMAINS DISABLED.")
          PY

      - name: Save updated records to private repository
        run: |
          set -e

          cp risk_state.json private-data/
          cp paper_trades.json private-data/

          git -C private-data config user.name "Market Settlement Bot"
          git -C private-data config user.email "actions@github.com"

          git -C private-data add risk_state.json paper_trades.json

          if ! git -C private-data diff --cached --quiet; then
            git -C private-data commit -m "Automatically settle resolved paper trades"
            git -C private-data push origin HEAD:main
            echo "Private trading records updated."
          else
            echo "No private record changes."
          fi

          echo "Automatic settlement workflow completed."
