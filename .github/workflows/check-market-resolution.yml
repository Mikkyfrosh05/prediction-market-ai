name: Check Predict Market Resolution

on:
  workflow_dispatch:

jobs:
  check-market:
    runs-on: ubuntu-latest

    steps:
      - name: Check market 4104539
        env:
          PREDICT_API_KEY: ${{ secrets.PREDICT_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests
          import json

          market_id = "4104539"

          url = f"https://api.predict.fun/v1/markets/{market_id}"

          headers = {
              "x-api-key": os.environ["PREDICT_API_KEY"],
              "accept": "application/json"
          }

          response = requests.get(
              url,
              headers=headers,
              timeout=20
          )

          print("HTTP STATUS:", response.status_code)

          response.raise_for_status()

          result = response.json()

          if not result.get("success"):
              raise RuntimeError("Predict.fun returned an unsuccessful response")

          market = result.get("data", {})

          print("\nMARKET INFORMATION")
          print("====================")
          print("ID:", market.get("id"))
          print("Title:", market.get("title"))
          print("Trading status:", market.get("tradingStatus"))
          print("Market status:", market.get("status"))

          print("\nRESOLUTION INFORMATION")
          print("====================")

          print(json.dumps(
              market.get("resolution"),
              indent=2
          ))

          print("\nOUTCOMES")
          print("====================")

          print(json.dumps(
              market.get("outcomes"),
              indent=2
          ))

          print("\nFULL MARKET DATA")
          print("====================")

          print(json.dumps(market, indent=2))
          PY
