name: Update Market Data

"on":
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update-markets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Fetch BTC 5-Minute Markets
        env:
          PREDICT_API_KEY: ${{ secrets.PREDICT_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests

          from datetime import datetime, timezone

          API_URL = "https://api.predict.fun/v1/categories"

          API_KEY = os.environ.get("PREDICT_API_KEY")

          if not API_KEY:
              raise ValueError("PREDICT_API_KEY is missing!")

          HEADERS = {
              "x-api-key": API_KEY
          }

          collected_markets = []
          seen_market_ids = set()

          cursor = None
          max_pages = 20

          def get_crypto_details(category):
              details = category.get("variantDetails") or {}
              variant_data = category.get("variantData") or {}

              crypto = details.get("crypto") or {}

              symbol = (
                  crypto.get("priceFeedSymbol")
                  or variant_data.get("priceFeedSymbol")
                  or ""
              )

              variant_type = (
                  variant_data.get("type")
                  or category.get("marketVariant")
              )

              return str(symbol).upper(), variant_type

          def is_bitcoin(symbol):
              normalized = (
                  symbol.replace("/", "")
                  .replace("-", "")
                  .replace("_", "")
                  .replace(" ", "")
              )

              return normalized.startswith("BTC")

          def get_duration(category):
              starts_at = category.get("startsAt")
              ends_at = category.get("endsAt")

              if not starts_at or not ends_at:
                  return None

              start = datetime.fromisoformat(
                  starts_at.replace("Z", "+00:00")
              )

              end = datetime.fromisoformat(
                  ends_at.replace("Z", "+00:00")
              )

              return int((end - start).total_seconds())

          print("Searching Predict.fun for BTC 5-minute categories...")

          for page in range(max_pages):

              params = {
                  "first": 50,
                  "status": "OPEN",
                  "marketVariant": "CRYPTO_UP_DOWN"
              }

              if cursor:
                  params["after"] = cursor

              response = requests.get(
                  API_URL,
                  headers=HEADERS,
                  params=params,
                  timeout=30
              )

              response.raise_for_status()

              result = response.json()

              if not result.get("success"):
                  raise Exception("Predict.fun API returned unsuccessful data")

              categories = result.get("data", [])

              print(
                  f"Page {page + 1}: "
                  f"{len(categories)} categories checked"
              )

              for category in categories:

                  symbol, variant_type = get_crypto_details(category)

                  if variant_type != "CRYPTO_UP_DOWN":
                      continue

                  if not is_bitcoin(symbol):
                      continue

                  duration = get_duration(category)

                  if duration != 300:
                      print(
                          "Skipping BTC category with duration:",
                          duration,
                          category.get("slug")
                      )
                      continue

                  markets = category.get("markets") or []

                  for market in markets:

                      market_id = market.get("id")

                      if market_id is None:
                          continue

                      if market_id in seen_market_ids:
                          continue

                      if market.get("tradingStatus") != "OPEN":
                          continue

                      if market.get("status") == "RESOLVED":
                          continue

                      if market.get("isVisible") is not True:
                          continue

                      market_record = dict(market)

                      market_record["category_id"] = category.get("id")
                      market_record["category_slug"] = category.get("slug")
                      market_record["category_title"] = category.get("title")

                      market_record["startsAt"] = category.get("startsAt")
                      market_record["endsAt"] = category.get("endsAt")

                      market_record["duration_seconds"] = duration
                      market_record["price_feed_symbol"] = symbol

                      market_record["crypto_variant"] = variant_type

                      market_record["crypto_start_price"] = (
                          category.get("variantDetails", {})
                          .get("crypto", {})
                          .get("startPrice")
                      )

                      market_record["crypto_end_price"] = (
                          category.get("variantDetails", {})
                          .get("crypto", {})
                          .get("endPrice")
                      )

                      collected_markets.append(market_record)
                      seen_market_ids.add(market_id)

                      print(
                          "BTC 5M MARKET FOUND:",
                          market.get("title"),
                          "| ID:",
                          market_id
                      )

              cursor = result.get("cursor")

              if not cursor:
                  break

          output = {
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "asset": "BTC",
              "market_type": "CRYPTO_UP_DOWN",
              "timeframe": "5 minutes",
              "duration_seconds": 300,
              "total_markets": len(collected_markets),
              "markets": collected_markets
          }

          with open("market_data.json", "w") as file:
              json.dump(output, file, indent=2)

          print("\nBTC 5-MINUTE COLLECTION COMPLETE")
          print("Markets collected:", len(collected_markets))

          if not collected_markets:
              print(
                  "No matching BTC 5-minute markets were found. "
                  "The system will not substitute other markets."
              )
          PY

      - name: Save market data
        run: |
          git config user.name "Market Data Bot"
          git config user.email "actions@github.com"
          git add market_data.json
          git diff --cached --quiet || git commit -m "Update BTC 5-minute market data"
          git push
