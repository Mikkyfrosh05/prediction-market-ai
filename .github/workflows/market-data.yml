name: Update Market Data

"on":
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update-markets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Fetch Current BTC 5-Minute Markets
        env:
          PREDICT_API_KEY: ${{ secrets.PREDICT_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests
          import time

          from datetime import datetime, timezone

          API_URL = "https://api.predict.fun/v1/categories"
          API_KEY = os.environ.get("PREDICT_API_KEY")

          if not API_KEY:
              raise ValueError("PREDICT_API_KEY is missing")

          HEADERS = {"x-api-key": API_KEY}

          now = int(time.time())
          current_round = (now // 300) * 300

          collected = []
          seen = set()

          print("Current UTC time:",
                datetime.now(timezone.utc).isoformat())

          print("Current BTC round timestamp:", current_round)

          # Check two previous rounds and twelve upcoming rounds.
          for offset in range(-2, 13):

              timestamp = current_round + (offset * 300)

              slug = f"btc-updown-5m-{timestamp}"

              url = f"{API_URL}/{slug}"

              print("\nChecking:", slug)

              response = requests.get(
                  url,
                  headers=HEADERS,
                  timeout=20
              )

              if response.status_code == 404:
                  print("Category not found.")
                  continue

              response.raise_for_status()

              result = response.json()

              if not result.get("success"):
                  print("Unsuccessful API response.")
                  continue

              category = result.get("data")

              if not category:
                  continue

              variant_data = category.get("variantData") or {}
              details = category.get("variantDetails") or {}
              crypto = details.get("crypto") or {}

              symbol = (
                  crypto.get("priceFeedSymbol")
                  or variant_data.get("priceFeedSymbol")
                  or ""
              )

              variant_type = (
                  variant_data.get("type")
                  or category.get("marketVariant")
              )

              if isinstance(variant_type, dict):
                  variant_type = variant_type.get("type")

              if variant_type != "CRYPTO_UP_DOWN":
                  continue

              if not str(symbol).upper().startswith("BTC"):
                  continue

              start = category.get("startsAt")
              end = category.get("endsAt")

              if not start or not end:
                  continue

              start_dt = datetime.fromisoformat(
                  start.replace("Z", "+00:00")
              )

              end_dt = datetime.fromisoformat(
                  end.replace("Z", "+00:00")
              )

              duration = int(
                  (end_dt - start_dt).total_seconds()
              )

              if duration != 300:
                  continue

              for market in category.get("markets") or []:

                  market_id = market.get("id")

                  if market_id is None or market_id in seen:
                      continue

                  if market.get("tradingStatus") != "OPEN":
                      continue

                  if market.get("status") == "RESOLVED":
                      continue

                  if market.get("isVisible") is not True:
                      continue

                  record = dict(market)

                  record["category_id"] = category.get("id")
                  record["category_slug"] = category.get("slug")
                  record["category_title"] = category.get("title")
                  record["startsAt"] = start
                  record["endsAt"] = end
                  record["duration_seconds"] = duration
                  record["price_feed_symbol"] = symbol
                  record["crypto_variant"] = variant_type
                  record["crypto_start_price"] = crypto.get("startPrice")
                  record["crypto_end_price"] = crypto.get("endPrice")

                  collected.append(record)
                  seen.add(market_id)

                  print("BTC MARKET FOUND:",
                        market.get("title"),
                        "| ID:", market_id)

          output = {
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "asset": "BTC",
              "market_type": "CRYPTO_UP_DOWN",
              "timeframe": "5 minutes",
              "duration_seconds": 300,
              "total_markets": len(collected),
              "markets": collected
          }

          with open("market_data.json", "w") as file:
              json.dump(output, file, indent=2)

          print("\nCOLLECTION COMPLETE")
          print("Markets collected:", len(collected))

          if not collected:
              raise Exception(
                  "No BTC 5-minute markets found. "
                  "Check the API response and category slug format."
              )
          PY

      - name: Save market data
        run: |
          git config user.name "Market Data Bot"
          git config user.email "actions@github.com"
          git add market_data.json
          git diff --cached --quiet || git commit -m "Update BTC 5-minute market data"
          git push
