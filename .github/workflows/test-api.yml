name: Test Predict API

on:
  workflow_dispatch:

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Test Predict.fun connection
        env:
          PREDICT_API_KEY: ${{ secrets.PREDICT_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests

          url = "https://api.predict.fun/v1/markets"

          headers = {
              "x-api-key": os.environ["PREDICT_API_KEY"]
          }

          response = requests.get(
              url,
              headers=headers,
              params={"first": 5},
              timeout=30
          )

          print("HTTP Status:", response.status_code)

          response.raise_for_status()

          result = response.json()
          markets = result.get("data", [])

          print("API connection successful!")
          print("Markets returned:", len(markets))

          for market in markets:
              print("-", market.get("title", "Untitled"))
          PY
